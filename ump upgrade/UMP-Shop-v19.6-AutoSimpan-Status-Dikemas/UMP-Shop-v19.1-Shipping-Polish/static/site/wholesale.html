<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UMP Shop • Grosir</title><link rel="stylesheet" href="style.css"><style>
body{background:#f4f7fb}.gw{max-width:1200px;margin:auto;padding:28px 18px}.gh{background:linear-gradient(135deg,#071b35,#0e3d68);color:#fff;border-radius:22px;padding:30px;margin-bottom:20px}.gh a{color:#fff;text-decoration:none}.gh h1{font-size:34px;margin:15px 0 7px}.toolbar{display:flex;gap:12px;margin:18px 0}.toolbar input{flex:1;padding:14px;border:1px solid #dbe3ec;border-radius:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:16px}.wc{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 5px 20px #13233a12}.wc img{width:100%;height:180px;object-fit:contain;background:#fff}.wb{padding:16px}.tag{display:inline-block;background:#eaf3ff;color:#0d5cab;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:800}.wb h3{margin:10px 0 5px}.normal{text-decoration:line-through;color:#8994a3;font-size:12px}.price{font-size:21px;font-weight:900;color:#d71920;margin:4px 0}.meta{font-size:12px;color:#657487;margin-bottom:12px}.qty{display:flex;gap:7px;align-items:center}.qty input{width:68px;padding:9px;border:1px solid #d8e0e8;border-radius:9px}.btn{border:0;border-radius:10px;padding:10px 12px;background:#d71920;color:#fff;font-weight:800;cursor:pointer}.cart{position:fixed;right:18px;bottom:18px;background:#071b35;color:#fff;border-radius:15px;padding:14px 18px;box-shadow:0 8px 30px #0003;cursor:pointer;z-index:4}.panel{background:#fff;border-radius:18px;padding:20px;margin-top:22px}.ci{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #edf0f4}.checkout{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.checkout input,.checkout select,.checkout textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #dbe2ea;border-radius:10px}.full{grid-column:1/-1}.empty{text-align:center;padding:35px;color:#718096}.note{background:#fff5e8;border-radius:12px;padding:12px;color:#8a5700;margin:12px 0}@media(max-width:650px){.checkout{grid-template-columns:1fr}.full{grid-column:auto}.gh h1{font-size:27px}}
</style><script src="realtime.js"></script></head><body><main class="gw"><section class="gh"><a href="customer.html">← Kembali ke Toko Customer</a><h1>📦 Toko Grosir UMP</h1><p>Harga khusus pembelian banyak. Produk, harga grosir, minimal pembelian, dan stok dikelola Admin.</p></section><div class="toolbar"><input id="q" placeholder="Cari barang grosir..." oninput="draw()"></div><div id="items" class="grid"></div><section class="panel" id="cartPanel"><h2>Keranjang Grosir</h2><div id="cartItems"></div><div style="display:flex;justify-content:space-between;font-size:20px;margin-top:15px"><b>Total</b><b id="total">Rp 0</b></div><div class="note">Pengiriman grosir tersedia: Lalamove, J&amp;T Cargo, dan Ambil di Toko.</div><div class="checkout"><input id="name" placeholder="Nama penerima"><input id="phone" placeholder="No. HP"><textarea class="full" id="address" rows="3" placeholder="Alamat lengkap"></textarea><select id="shipping"><option>Lalamove</option><option>J&T Cargo</option><option>Ambil di Toko</option></select><select id="payment"><option>Transfer Bank</option><option>QRIS</option><option>DANA</option><option>Bayar di Toko / Tunai</option></select><button class="btn full" onclick="checkout()">Buat Pesanan Grosir</button></div></section></main><button class="cart" onclick="document.getElementById('cartPanel').scrollIntoView({behavior:'smooth'})">🛒 Grosir <b id="count">0</b></button><script>
const rp=n=>'Rp '+Number(n||0).toLocaleString('id-ID');const customerSession=JSON.parse(localStorage.getItem('ump_customer_session')||'null');if(!customerSession){location.href='index.html'}const products=()=>JSON.parse(localStorage.getItem('ump_products')||'[]');const cfg=()=>JSON.parse(localStorage.getItem('ump_wholesale_catalog')||'{}');let cart=JSON.parse(localStorage.getItem('ump_wholesale_cart')||'[]');
function enabled(){let c=cfg();return products().filter(p=>c[p.id]?.enabled).map(p=>({...p,wholesalePrice:Number(c[p.id].price||p.price),minQty:Number(c[p.id].minQty||1),unit:c[p.id].unit||'pcs'}))}
function draw(){let q=document.getElementById('q').value.toLowerCase(),ps=enabled().filter(p=>(p.name+' '+p.category).toLowerCase().includes(q));document.getElementById('items').innerHTML=ps.map(p=>`<article class="wc"><img src="${p.image||'assets/logo-ump.jpg'}" onerror="this.src='assets/logo-ump.jpg'"><div class="wb"><span class="tag">GROSIR • ${p.unit}</span><h3>${p.name}</h3><div class="normal">Eceran ${rp(p.price)}</div><div class="price">${rp(p.wholesalePrice)}</div><div class="meta">Min. ${p.minQty} ${p.unit} • Stok ${p.stock}</div><div class="qty"><input id="qty-${p.id}" type="number" min="${p.minQty}" value="${p.minQty}"><button class="btn" onclick="add(${p.id})">+ Keranjang</button></div></div></article>`).join('')||'<div class="empty">Belum ada produk grosir aktif. Admin dapat mengaktifkannya dari menu Barang Grosir.</div>';renderCart()}
function add(id){let p=enabled().find(x=>x.id==id),q=Number(document.getElementById('qty-'+id).value);if(!p||q<p.minQty)return alert('Minimal pembelian '+p.minQty+' '+p.unit);if(q>p.stock)return alert('Stok tidak cukup');let x=cart.find(x=>x.id==id);if(x)x.qty=q;else cart.push({id:p.id,name:p.name,price:p.wholesalePrice,qty:q,image:p.image,category:'Grosir',unit:p.unit,minQty:p.minQty});localStorage.setItem('ump_wholesale_cart',JSON.stringify(cart));renderCart()}
function removeItem(id){cart=cart.filter(x=>x.id!=id);localStorage.setItem('ump_wholesale_cart',JSON.stringify(cart));renderCart()}
function renderCart(){document.getElementById('count').textContent=cart.reduce((s,x)=>s+x.qty,0);document.getElementById('cartItems').innerHTML=cart.map(x=>`<div class="ci"><span><b>${x.name}</b><br><small>${x.qty} ${x.unit} × ${rp(x.price)}</small></span><span><b>${rp(x.qty*x.price)}</b> <button onclick="removeItem(${x.id})">×</button></span></div>`).join('')||'<div class="empty">Keranjang grosir masih kosong.</div>';document.getElementById('total').textContent=rp(cart.reduce((s,x)=>s+x.qty*x.price,0))}
function checkout(){if(!cart.length)return alert('Keranjang grosir kosong');let name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),address=document.getElementById('address').value.trim();if(!name||!phone||!address)return alert('Lengkapi data penerima');let ps=products();for(let x of cart){let p=ps.find(y=>y.id==x.id);if(!p||p.stock<x.qty)return alert('Stok '+x.name+' tidak cukup');}let now=new Date().toISOString(),id='GRS-'+Date.now().toString().slice(-8),total=cart.reduce((s,x)=>s+x.qty*x.price,0),pay=document.getElementById('payment').value,ship=document.getElementById('shipping').value;for(let x of cart){let p=ps.find(y=>y.id==x.id);p.stock-=x.qty}localStorage.setItem('ump_products',JSON.stringify(ps));let orders=JSON.parse(localStorage.getItem('ump_customer_orders')||'[]');orders.unshift({orderId:id,orderType:'Grosir',customerId:customerSession?.id,username:customerSession?.username||'',name,phone,address,payment:pay,shipping:ship,courier:ship,shippingCost:0,subtotal:total,total,items:cart.map(x=>({...x})),date:now,status:'Pesanan Dibuat',paymentStatus:pay==='Bayar di Toko / Tunai'?'Bayar di Toko':'Menunggu Verifikasi'});localStorage.setItem('ump_customer_orders',JSON.stringify(orders));let tx=JSON.parse(localStorage.getItem('ump_transactions')||'[]');cart.forEach((x,i)=>tx.unshift({id:Date.now()+i,type:'Penjualan Grosir',product:x.name,qty:x.qty,total:x.qty*x.price,date:now,customer:name,phone,payment:pay,orderId:id,orderType:'Grosir'}));localStorage.setItem('ump_transactions',JSON.stringify(tx));cart=[];localStorage.setItem('ump_wholesale_cart','[]');renderCart();alert('Pesanan grosir berhasil dibuat. Nomor: '+id);location.href='customer.html?view=orders'}
if(customerSession){document.getElementById('name').value=customerSession.name||'';document.getElementById('phone').value=customerSession.phone||'';document.getElementById('address').value=customerSession.address||'';}draw();
</script></body></html>
